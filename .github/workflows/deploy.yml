name: Build and Deploy

on:
    workflow_dispatch: {}

permissions:
    id-token: write
    contents: read

env: # need pass in .env variables to make available for workflow during build
    AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
    AWS_IAMROLE_GITHUB: ${{ vars.AWS_IAMROLE_GITHUB }}
    AWS_REGION: ${{ vars.AWS_REGION }}

jobs:
    build:
        name: Build and Deploy
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4 # need setup github role for repo

            - name: Setup pnpm
              uses: pnpm/action-setup@4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Configure AWS Credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ secrets.AWS_IAMROLE_GITHUB }}
                  role-session-name: GitHub-Action-Role
                  aws-region: ${{ env.AWS_REGION }}

            - name: Deploy CDK Stack
              run: pnpm cdk deploy --require-approval never
